// Applied only by the production build command. Expo's generated release block
// otherwise inherits its debug signing configuration; finalizeDsl replaces it
// after the generated build.gradle has finished configuring the Android plugin.
gradle.beforeProject { project ->
    if (project.path == ':app') {
        project.pluginManager.withPlugin('com.android.application') {
            project.extensions.getByName('androidComponents').finalizeDsl { android ->
                def required = { String name ->
                    def value = System.getenv(name)
                    if (!value) {
                        throw new GradleException("Missing required release signing environment variable: ${name}")
                    }
                    return value
                }
                def keystore = project.file(required('ANDROID_KEYSTORE_PATH'))
                if (!keystore.isFile()) {
                    throw new GradleException('Release signing keystore does not exist')
                }
                def signing = android.signingConfigs.maybeCreate('release')
                signing.storeFile = keystore
                signing.storeType = 'PKCS12'
                signing.storePassword = required('ANDROID_KEYSTORE_PASSWORD')
                signing.keyAlias = required('ANDROID_KEY_ALIAS')
                signing.keyPassword = required('ANDROID_KEY_PASSWORD')

                def release = android.buildTypes.getByName('release')
                release.signingConfig = signing
                release.debuggable = false
                release.jniDebuggable = false
            }
        }
    }
}
